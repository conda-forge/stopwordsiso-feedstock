{% set name = "stopwordsiso" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cc3fd2ca524fa02f24609a133eb2a27afe803fe86fa2761cdb7b0b4bced53b4c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - setuptools

test:
  imports:
    - stopwordsiso
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/stopwords-iso/stopwords-iso
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Collection of stopwords for multiple languages. Using ISO 639-1 language code.

extra:
  recipe-maintainers:
    - dcfidalgo
